name: Model eval report

# Scores every model listed in evals/models.json on every eval task and builds one comparison
# report (job summary plus an eval-report artifact with markdown and HTML). Nothing here can fail a
# pull request or a merge: the jobs are not required checks and every step tolerates failure.
# Pass/fail floors live in evals/thresholds.json and are null until we have enough history.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "crates/ceevee-ai/evals/**"
      - "crates/ceevee-ai/prompts/**"
      - "evals/**"
      - "scripts/eval-report.mjs"
      - ".github/workflows/eval-report.yml"

permissions:
  contents: read

concurrency:
  group: eval-report
  cancel-in-progress: true

env:
  # Hosted macOS runners have no real GPU, so run on the CPU.
  CEEVEE_GPU_LAYERS: "0"

jobs:
  models:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(jq -c '{include: .models}' evals/models.json)" >> "$GITHUB_OUTPUT"

  score:
    name: score ${{ matrix.id }}
    needs: models
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.models.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Restore model cache
        id: cache
        uses: actions/cache@v4
        with:
          path: model/model.gguf
          key: model-${{ matrix.url }}-${{ matrix.sha256 }}

      - name: Download and verify model
        run: |
          mkdir -p model
          if [ ! -f model/model.gguf ]; then
            curl --fail --location --retry 5 --retry-delay 10 -o model/model.gguf "${{ matrix.url }}"
          fi
          actual=$(shasum -a 256 model/model.gguf | cut -d' ' -f1)
          echo "sha256: $actual"
          [ -z "${{ matrix.sha256 }}" ] || [ "$actual" = "${{ matrix.sha256 }}" ]

      - name: Build the eval tool
        run: cargo build --release --locked -q -p ceevee-ai --features llama --bin ceevee-eval

      - name: Score each task
        continue-on-error: true
        env:
          CEEVEE_EVAL_MODEL: ${{ matrix.id }}
          # Per task, so a slow task cannot starve the next one.
          CEEVEE_EVAL_BUDGET_SECS: "900"
        run: |
          mkdir -p results
          for task in extract_posting import_resume; do
            CEEVEE_EVAL_JSON="results/${{ matrix.id }}-$task.json" \
              timeout 1200 ./target/release/ceevee-eval "$PWD/model/model.gguf" "$task" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.id }}
          path: results/
          if-no-files-found: ignore

  report:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: eval-results-*
          path: results
          merge-multiple: true
      - name: Build report
        run: |
          mkdir -p results
          node scripts/eval-report.mjs results report --thresholds evals/thresholds.json
          cat report/eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: report/
