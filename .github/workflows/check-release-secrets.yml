# Manual check of the release signing secrets. It signs throwaway files only and publishes
# nothing. Secret values are never printed; the log shows only pass/fail and key IDs.
name: Check release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-key:
    runs-on: ubuntu-latest
    environment: release-build
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      EXPECTED_KEY_ID: 153C8CE0A69E502C
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secrets present
        run: |
          for n in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!n}" ]; then echo "present: $n"; else echo "::error::missing: $n"; fail=1; fi
          done
          exit ${fail:-0}
      - name: Sign a dummy file with the updater key
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile >/dev/null
          echo "dummy" > /tmp/dummy.bin
          pnpm tauri signer sign /tmp/dummy.bin >/dev/null
          test -s /tmp/dummy.bin.sig && echo "signing worked (password and key are a valid pair)"
      - name: Signature key ID matches the expected public key
        run: |
          python3 - <<'PY'
          import base64, os
          lines = base64.b64decode(open('/tmp/dummy.bin.sig').read().strip()).decode().splitlines()
          raw = base64.b64decode(lines[1])
          kid = raw[2:10]
          got = {kid.hex().upper(), kid[::-1].hex().upper()}
          want = os.environ['EXPECTED_KEY_ID']
          print('signature key id:', sorted(got)[0] if want not in got else want)
          raise SystemExit(0 if want in got else 'key ID does not match ' + want)
          PY

  apple:
    runs-on: macos-latest
    environment: release-build
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - name: Secrets present
        run: |
          for n in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [ -n "${!n}" ]; then echo "present: $n"; else echo "::error::missing: $n"; fail=1; fi
          done
          exit ${fail:-0}
      - name: Import the certificate and sign a dummy binary
        run: |
          KC="$RUNNER_TEMP/check.keychain-db"; PW="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "identities in the certificate:"; security find-identity -v -p codesigning "$KC" | sed -E 's/^ *[0-9]+\) [0-9A-F]+ //'
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/d.c" && cc "$RUNNER_TEMP/d.c" -o "$RUNNER_TEMP/dummy"
          codesign --force --options runtime --timestamp --keychain "$KC" --sign "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/dummy"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/dummy"
          echo "codesign with the identity worked"
      - name: App Store Connect API key works (notarization credentials)
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" >/dev/null
          echo "notarytool accepted the API key (no submission made)"

  azure:
    runs-on: ubuntu-latest
    environment: release-build
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    steps:
      - name: Presence only (Azure setup is still in progress)
        run: |
          for n in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -n "${!n}" ]; then echo "present: $n"; else echo "missing: $n"; fi
          done
