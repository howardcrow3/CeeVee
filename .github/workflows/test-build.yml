name: Test build

# An unsigned macOS (Apple silicon) .dmg for hands-on testing, built from whatever commit runs it.
# Run it from the Actions tab ("Run workflow"), or push a branch named test-build/anything.
# The download is the "CeeVee-test-macos" artifact at the bottom of the run page.
# Not for customers: it is not signed or notarized. docs/TESTING.md says how to open it.

on:
  workflow_dispatch:
  push:
    branches: ['test-build/**']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Public half of the license signing key. Without it the app cannot activate a key.
      CEEVEE_LICENSE_PUBKEY: ${{ vars.CEEVEE_LICENSE_PUBKEY || '425825fea3f127966fe6038b40d17779aac03560a6c9501fb95ba0d55435472a' }}
      CEEVEE_GOOGLE_CLIENT_ID: ${{ secrets.CEEVEE_GOOGLE_CLIENT_ID || vars.CEEVEE_GOOGLE_CLIENT_ID }}
      CEEVEE_GOOGLE_CLIENT_SECRET: ${{ secrets.CEEVEE_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build number
        run: |
          # Counts every commit on this branch, so it only ever goes up between builds.
          n=$(git rev-list --count HEAD)
          echo "CEEVEE_BUILD_NUMBER=$n" >> "$GITHUB_ENV"
          echo "CEEVEE_BUILD_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build (real AI engine, no signing)
        working-directory: apps/desktop
        run: pnpm tauri build --ci --no-sign --bundles dmg --target aarch64-apple-darwin --features llama
      - name: Collect
        run: |
          mkdir -p out
          v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "out/CeeVee_${v}_build${CEEVEE_BUILD_NUMBER}_${CEEVEE_BUILD_SHA}_aarch64_UNSIGNED.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: CeeVee-test-macos-build${{ env.CEEVEE_BUILD_NUMBER }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14
