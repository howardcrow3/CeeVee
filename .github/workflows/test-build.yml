name: Test build

# An unsigned macOS (Apple silicon) .dmg for hands-on testing, built from whatever commit runs it.
# Run it from the Actions tab ("Run workflow"), or push a branch named test-build/anything.
# The download is the "CeeVee-test-macos" artifact at the bottom of the run page.
# Not for customers: it is not signed or notarized. docs/TESTING.md says how to open it.

on:
  workflow_dispatch:
  push:
    branches: ['test-build/**']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build (real AI engine, no signing)
        working-directory: apps/desktop
        run: pnpm tauri build --ci --no-sign --bundles dmg --target aarch64-apple-darwin --features llama
      - name: Collect
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: CeeVee-test-macos
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14
