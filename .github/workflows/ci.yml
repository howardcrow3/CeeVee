name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: UI checks
        working-directory: apps/desktop/ui
        run: |
          pnpm lint
          pnpm check
          pnpm test
          pnpm license-check
          pnpm build

      - name: Version consistency and script tests
        shell: bash
        run: |
          node scripts/bump-version.mjs --check
          node --test scripts/scripts.test.mjs

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: TypeScript bindings are current
        run: cargo run --locked -p ceevee-desktop -- --check-bindings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Build unsigned app bundle
        working-directory: apps/desktop
        run: pnpm tauri build --ci --no-sign -- --locked

  licenses:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
