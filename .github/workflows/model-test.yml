name: Real model test

# Runs the llama.cpp backend against a small real model on Windows and Apple silicon: loading,
# grammar-constrained output, streaming, unloading, then the task eval cases. The model is
# downloaded once, checked against a pinned SHA-256 and cached.

on:
  pull_request:
    paths:
      - "crates/ceevee-ai/**"
      - "crates/ceevee-agent/**"
      - ".github/workflows/model-test.yml"
  push:
    branches: [main]
    paths:
      - "crates/ceevee-ai/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hosted macOS runners have no real GPU, so Metal is very slow there. Run on the CPU in CI.
  CEEVEE_GPU_LAYERS: "0"
  # Qwen3 0.6B, Q8_0, from Qwen's official GGUF repository. Apache-2.0.
  MODEL_URL: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
  # Hash of the file above. Leave empty to print a new download's hash without failing, then pin it.
  MODEL_SHA256: "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"

jobs:
  real-model:
    name: real-model (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Find libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Restore model cache
        id: cache
        uses: actions/cache@v4
        with:
          path: model/model.gguf
          key: model-${{ env.MODEL_URL }}-${{ env.MODEL_SHA256 }}

      - name: Download model
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p model
          curl --fail --location --retry 5 --retry-delay 10 -o model/model.gguf "$MODEL_URL"
          ls -l model/model.gguf

      - name: Check model hash
        shell: bash
        run: |
          actual=$(python3 -c "import hashlib,sys; print(hashlib.sha256(open('model/model.gguf','rb').read()).hexdigest())")
          echo "model sha256: $actual"
          if [ -z "$MODEL_SHA256" ]; then
            echo "::warning::MODEL_SHA256 is not pinned yet. Pin $actual in .github/workflows/model-test.yml"
          elif [ "$actual" != "$MODEL_SHA256" ]; then
            echo "::error::model hash mismatch (expected $MODEL_SHA256)"
            exit 1
          fi

      - name: Real model test
        shell: bash
        run: |
          CEEVEE_TEST_MODEL="$PWD/model/model.gguf" \
            cargo test --release --locked -p ceevee-ai --features llama -- --ignored --nocapture

      - name: Eval cases (extract_posting)
        if: hashFiles('crates/ceevee-ai/src/bin/ceevee-eval.rs') != ''
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run --release --locked -q -p ceevee-ai --features llama --bin ceevee-eval -- "$PWD/model/model.gguf" extract_posting | tee eval.txt
          { echo '### Eval extract_posting: ${{ matrix.name }}'; echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The import_resume grammar is slow to sample with llama.cpp (nested lists of nullable
      # objects), and on hosted CPU runners it can run past any sensible limit. Report only until
      # the schema is reshaped; see docs/QUESTIONS.md question 15.
      - name: Eval cases (import_resume, report only)
        if: hashFiles('crates/ceevee-ai/src/bin/ceevee-eval.rs') != ''
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          cargo run --release --locked -q -p ceevee-ai --features llama --bin ceevee-eval -- "$PWD/model/model.gguf" import_resume | tee eval-resume.txt
          { echo '### Eval import_resume: ${{ matrix.name }}'; echo '```'; cat eval-resume.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
