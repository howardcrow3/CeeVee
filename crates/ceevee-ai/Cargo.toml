[package]
name = "ceevee-ai"
description = "CeeVee: llama.cpp runtime, model manager, tasks, grammars, prompts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ceevee-core.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["common"] }

[features]
# The real inference engine. Off by default: it compiles llama.cpp, which needs cmake and clang.
llama = ["dep:llama-cpp-2"]
# Vulkan GPU support for Windows. Metal is enabled automatically on Apple silicon.
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

[[bin]]
name = "ceevee-eval"
path = "src/bin/ceevee-eval.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["common", "metal"] }
