[package]
name = "ceevee-mail"
description = "CeeVee: IMAP/SMTP, OAuth, classification, linking, alert-email parsing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ceevee-core.workspace = true
ceevee-ai.workspace = true
ceevee-db.workspace = true
ceevee-search.workspace = true
ceevee-docs.workspace = true
ceevee-profile.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
mail-parser = "0.11"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
futures-util.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
