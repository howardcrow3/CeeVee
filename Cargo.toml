[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/ceevee-core",
  "crates/ceevee-db",
  "crates/ceevee-ai",
  "crates/ceevee-agent",
  "crates/ceevee-profile",
  "crates/ceevee-docs",
  "crates/ceevee-search",
  "crates/ceevee-apply",
  "crates/ceevee-google",
  "crates/ceevee-mail",
  "crates/ceevee-network",
  "crates/ceevee-license",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
ceevee-core = { path = "crates/ceevee-core" }
ceevee-db = { path = "crates/ceevee-db" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
