# License and advisory policy (docs/TECHNICAL_PLAN.md, section 1).
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0",
  "Unlicense", "CDLA-Permissive-2.0", "OpenSSL",
]
# GPL, LGPL, AGPL and SSPL are rejected simply by not being listed.

[licenses.private]
ignore = true # our own crates

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
# RUSTSEC-2026-0459: bundled SQLite < 3.54 can leak uninitialised memory when opening a database
# next to a crafted -wal file. CeeVee only opens its own file in its own app-data folder, and
# sqlx 0.8 and 0.9 both pin libsqlite3-sys < 0.39. Remove this ignore as soon
# as sqlx moves to libsqlite3-sys >= 0.39.
# RUSTSEC-2024-0436: `paste` is unmaintained (a notice, not a vulnerability). It is a
# compile-time proc macro pulled in by specta, with no safe upgrade available.
# Typst (PDF rendering) pulls in several dependencies with advisories. Unmaintained notices:
# RUSTSEC-2025-0141 bincode, RUSTSEC-2026-0206 rustybuzz, RUSTSEC-2026-0192 ttf-parser,
# RUSTSEC-2024-0449 unsafe-libyaml, RUSTSEC-2024-0320 yaml-rust. RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 are quick-xml denial-of-service issues in parsing XML; typst 0.15.1 pins
# quick-xml 0.38. CeeVee renders only Typst source it generates itself, which never reads XML
# or other files (the renderer denies all file access), so none of these is reachable with
# untrusted input. Remove these ignores when typst moves to quick-xml >= 0.41.
ignore = [
  "RUSTSEC-2026-0459", "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0141", "RUSTSEC-2026-0206", "RUSTSEC-2026-0192", "RUSTSEC-2024-0449",
  "RUSTSEC-2024-0320", "RUSTSEC-2026-0194", "RUSTSEC-2026-0195",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
